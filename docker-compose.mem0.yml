# Self-hosted Mem0 (OpenMemory) stack
# Optional — only needed if you want to self-host instead of using Mem0 cloud API.
#
# Uses external inference (OpenAI-compatible). Set OPENAI_API_KEY in your environment.
# For Mem0 cloud, just set MEM0_API_KEY in .env — no Docker needed.
#
# Usage:
#   docker compose -f docker-compose.mem0.yml up -d
#   Then set MEM0_SSE_URL=http://localhost:8765/sse in .env

services:
  mem0_store:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  openmemory:
    image: mem0/openmemory-mcp:latest
    ports: ["0.0.0.0:8765:8765"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on: [mem0_store]
    # Patches applied at container start (before uvicorn):
    # 1. Categorization no-op: SDK 1.88.0 lacks with_response_format, after_insert
    #    listener retries 3x adding ~15s per store. Remove when SDK upgraded past 1.88.
    # 2. memories.py infer fix: REST router drops infer param when calling SDK,
    #    so gpt-4o-mini always runs and fragments stored memories. Also merges
    #    request.metadata into the Qdrant metadata dict.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'from typing import List\ndef get_categories_for_memory(memory: str) -> List[str]:\n    return []\n' > /usr/src/openmemory/app/utils/categorization.py
        rm -f /usr/src/openmemory/app/utils/__pycache__/categorization*.pyc
        python3 -c "
        p='/usr/src/openmemory/app/routers/memories.py'
        t=open(p).read()
        old='            metadata={\n                \"source_app\": \"openmemory\",\n                \"mcp_client\": request.app,\n            }\n        )'
        new='            metadata={\n                \"source_app\": \"openmemory\",\n                \"mcp_client\": request.app,\n                **request.metadata,\n            },\n            infer=request.infer,\n        )'
        if old in t:
            t=t.replace(old,new)
            open(p,'w').write(t)
            print('PATCH: memories.py infer+metadata fix applied')
        else:
            print('PATCH: memories.py already patched or structure changed')
        "
        rm -f /usr/src/openmemory/app/routers/__pycache__/memories*.pyc
        exec uvicorn main:app --host 0.0.0.0 --port 8765
    working_dir: /usr/src/openmemory
    restart: unless-stopped

volumes:
  qdrant_data:
